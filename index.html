<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Journey Ledger</title>

  <style>
    /* Native Splash Screen Styles */
    :root {
      /* "Wine Red" Background to match the Logo Image Card */
      /* Exact Match provided by User */
      --splash-bg: #4a1920;
      --splash-accent: #E6C888;
      /* Goldish for text if needed */
    }

    body {
      margin: 0;
      background-color: var(--splash-bg);
      /* Prevents white flash */
    }

    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--splash-bg);
      /* Fill screen with Wine Red */
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.6s ease-out, visibility 0.6s;
    }

    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo {
      /* "Not too big, but not small" */
      width: 260px;
      /* Increased from 80px */
      max-width: 60vw;
      height: auto;
      animation: fadein 1.5s ease-out;
      /* Box Shadow to help blend if colors are slightly off */
      /* box-shadow: 0 0 20px 20px var(--splash-bg); */
    }

    @keyframes fadein {
      0% {
        opacity: 0;
        transform: scale(0.9);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
  <meta name="theme-color" content="#4a1920" />
</head>

<body>
  <div id="splash">
    <img class="splash-logo" src="/logo.svg" alt="Journey Ledger" />
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
