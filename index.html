<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/aurea-mark.png" />
  <link rel="apple-touch-icon" href="/aurea-mark.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Aurea</title>

  <style>
    /* Native Splash Screen Styles */
    :root {
      --brand-bg: #40171A;
      --splash-accent: #E6C888;
      /* Goldish for text if needed */
    }

    body {
      margin: 0;
      background-color: var(--brand-bg);
      /* Prevents white flash */
    }

    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--brand-bg);
      /* Fill screen with Wine Red */
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.6s ease-out, visibility 0.6s;
    }

    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo {
      width: 360px;
      max-width: 72vw;
      max-height: 70vh;
      height: auto;
      object-fit: contain;
      animation: fadein 1.5s ease-out;
      /* Box Shadow to help blend if colors are slightly off */
      /* box-shadow: 0 0 20px 20px var(--brand-bg); */
    }

    @keyframes fadein {
      0% {
        opacity: 0;
        transform: scale(0.9);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
  <meta name="theme-color" content="#40171A" />
</head>

<body>
  <div id="splash">
    <img class="splash-logo" src="/aurea-splash.png" alt="Aurea" />
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
